<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login</title>
</head>
<body>
    <h1>LOGIN</h1>
    <form method="POST" action="/login">
        <div>
            Username: <input name="username" type="text" required />
        </div>
        <br />
        <div>
            Password: <input name="password" type="password" required />
        </div>
        <br />
        <button type="submit">Login</button>
    </form>
</body>
</html>
